[package]
name = "clearlane-engine"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "clearlane-engine"
path = "src/main.rs"

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]

[dependencies]
cef = { version = "=156.2.0", default-features = false, features = ["build-util"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
